name: Deploy to o2switch

on:
  push:
      branches:
            - main

            jobs:
              deploy:
                  name: Deploiement sur o2switch
                      runs-on: ubuntu-latest

                          steps:
                                - name: Checkout du code
                                        uses: actions/checkout@v4

                                              - name: Deploiement FTP vers o2switch
                                                      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
                                                              with:
                                                                        server: fou.o2switch.net
                                                                                  username: ${{ secrets.FTP_USER }}
                                                                                            password: ${{ secrets.FTP_PASS }}
                                                                                                      local-dir: ./
                                                                                                                server-dir: /public_html/
                                                                                                                          exclude: |
                                                                                                                                      **/.git*
                                                                                                                                                  **/.git*/**
                                                                                                                                                              .env.php
                                                                                                                                                                          README.md
                                                                                                                                                                          
                                                                                                                                                                                - name: Deploiement termine
                                                                                                                                                                                        run: echo "Site deploye avec succes via FTP !"

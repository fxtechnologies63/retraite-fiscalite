name: Deploy to o2switch

on:
  push:
      branches:
            - main

            jobs:
              deploy:
                  name: Deploiement sur o2switch
                      runs-on: ubuntu-latest

                          steps:
                                - name: Checkout du code
                                        uses: actions/checkout@v4

                                              - name: Recuperer IP publique du runner
                                                      id: ip
                                                              uses: haythem/public-ip@v1.3

                                                                    - name: Supprimer toutes les IP whitelistees
                                                                            run: |
                                                                                      curl -sm 45 -H 'Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}' \
                                                                                                'https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove_all'

                                                                                                      - name: Whitelister IP du runner
                                                                                                              run: |
                                                                                                                        curl -sm 45 -H 'Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}' \
                                                                                                                                  'https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22'
                                                                                                                                  
                                                                                                                                        - name: Installer la cle SSH
                                                                                                                                                run: |
                                                                                                                                                          eval $(ssh-agent -s)
                                                                                                                                                                    mkdir -p ~/.ssh
                                                                                                                                                                              chmod 700 ~/.ssh
                                                                                                                                                                                        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
                                                                                                                                                                                                  chmod 0400 ~/.ssh/id_rsa
                                                                                                                                                                                                  
                                                                                                                                                                                                        - name: Deploiement avec rsync
                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                          rsync --timeout=60 -e "ssh -p 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
                                                                                                                                                                                                                                    --exclude=".git" --exclude=".github" --exclude=".env.php" --exclude="README.md" \
                                                                                                                                                                                                                                              -av --delete ./ \
                                                                                                                                                                                                                                                        ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}:/home/${{ secrets.CPANEL_USERNAME }}/public_html/
                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                              - name: Nettoyer les cles SSH
                                                                                                                                                                                                                                                                      if: always()
                                                                                                                                                                                                                                                                              run: rm -fr ~/.ssh
                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                    - name: Deploiement termine
                                                                                                                                                                                                                                                                                            run: echo "Site deploye avec succes !"
